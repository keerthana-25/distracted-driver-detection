name: CI/CD ML Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: 'Run full training pipeline'
        required: false
        default: 'false'
      run_ablation:
        description: 'Run ablation study'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: "3.10"
  MODEL_PATH: "models/best_model.pth"

jobs:
  # ─────────────────────────────────────────────
  # Code Quality
  # ─────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install black flake8 isort

      - name: Black formatting check
        run: black --check --diff src/ webapp/ tests/ mlops/

      - name: Flake8 linting
        run: flake8 src/ webapp/ tests/ --max-line-length=100 --ignore=E501,W503,F401,F841,E402,E741,F541,E203

  # ─────────────────────────────────────────────
  # Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm torchmetrics mlflow pytest pytest-cov
          pip install numpy pandas scikit-learn Pillow matplotlib seaborn
          pip install flask flask-cors gradio opencv-python pyyaml tqdm

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -k "not test_minimal_training"

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # Integration Test (Synthetic Pipeline)
  # ─────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install timm torchmetrics mlflow pytest pytest-cov pytest-timeout
          pip install numpy pandas scikit-learn Pillow matplotlib seaborn
          pip install flask flask-cors opencv-python pyyaml tqdm

      - name: Run synthetic pipeline
        run: |
          python mlops/pipelines/pipeline.py \
            --config configs/config.yaml \
            --synthetic \
            --skip-training

      - name: Verify MLflow artifacts
        run: |
          python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          experiments = client.search_experiments()
          print(f'MLflow experiments: {[e.name for e in experiments]}')
          "

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v3
        with:
          name: mlflow-artifacts
          path: mlruns/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Training Pipeline (Manual Trigger)
  # ─────────────────────────────────────────────
  train:
    name: Training Pipeline
    runs-on: ubuntu-latest
    needs: integration
    if: github.event.inputs.run_training == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all dependencies
        run: pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Run training on synthetic dataset
        run: |
          python mlops/pipelines/pipeline.py \
            --config configs/config.yaml \
            --synthetic

      - name: Upload trained model
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/
          retention-days: 30

      - name: Upload training figures
        uses: actions/upload-artifact@v3
        with:
          name: training-figures
          path: docs/figures/
          retention-days: 30

  # ─────────────────────────────────────────────
  # Ablation Study (Manual Trigger)
  # ─────────────────────────────────────────────
  ablation:
    name: Ablation Study
    runs-on: ubuntu-latest
    needs: train
    if: github.event.inputs.run_ablation == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Run ablation study
        run: |
          python mlops/pipelines/pipeline.py \
            --config configs/config.yaml \
            --synthetic \
            --run-ablation

      - name: Upload ablation results
        uses: actions/upload-artifact@v3
        with:
          name: ablation-results
          path: mlops/ablation_results.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # Build Docker Image
  # ─────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: distracted-driver-detection:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Deployment (main branch only)
  # ─────────────────────────────────────────────
  deploy-hf:
    name: Deploy to HuggingFace Spaces
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python scripts/deploy_hf.py
        continue-on-error: true  # Don't fail pipeline if HF deploy fails
